<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldTest SIH 2026</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f1f5f9; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .admin-container { max-width: 900px; margin: 0 auto; padding: 15px; } /* Wider for HQ */
        
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.2s; }
        .btn-primary { background: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: #64748b; color: white; padding: 8px 15px; border-radius: 8px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #475569; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; background: #f8fafc; transition: border 0.3s; }
        input:focus { border-color: #2563eb; outline: none; background: white; }
        
        .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 16px 16px 0 0; margin-bottom: -10px; z-index: 10; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .camera-btn { display: block; width: 100%; background: #eff6ff; color: #2563eb; border: 2px dashed #3b82f6; padding: 20px; text-align: center; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .camera-btn i { font-size: 24px; display: block; margin-bottom: 5px; }
        input[type="file"] { display: none; }

        .history-item { padding: 15px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .history-item:last-child { border-bottom: none; }
        .badge-pos { background: #fee2e2; color: #dc2626; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-neg { background: #dcfce3; color: #16a34a; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-dot { height: 10px; width: 10px; background-color: #16a34a; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        #update-screen, #officer-section, #admin-section { display: none; }
    </style>
</head>
<body>

    <div id="main-wrapper" class="container">
        
        <!-- 1. LOGIN SCREEN -->
        <div id="login-section" class="card" style="margin-top: 10vh; text-align: center; padding: 40px 25px;">
            <div style="background: #e0e7ff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;">
                <span style="font-size: 30px;">🛡️</span>
            </div>
            <h2 style="color: #0f172a; margin-bottom: 5px;">FieldTest Portal</h2>
            <p style="color: #64748b; margin-top: 0; margin-bottom: 25px; font-size: 14px;">Govt. Authorized Access Only</p>
            
            <div class="input-group">
                <input type="text" id="userid" placeholder="Officer ID (e.g. OFF001)">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <button class="btn btn-primary" onclick="login()">Secure Login</button>
        </div>

        <!-- 2. OFFICER APP SCREEN -->
        <div id="officer-section">
            <div class="header">
                <div>
                    <h2 style="margin: 0; font-size: 20px;">Field App</h2>
                    <small id="officer-id-display" style="color: #94a3b8;"></small>
                </div>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>
            
            <div class="card" style="border-radius: 0 0 16px 16px; padding-top: 30px;">
                <div style="text-align: right; margin-bottom: 15px; font-size: 12px; color: #64748b;">
                    <span id="network-indicator"><span class="status-dot"></span>System Active</span>
                </div>
                
                <form id="test-form">
                    <div class="input-group">
                        <label>Kit Reference Number</label>
                        <input type="text" id="kit-ref" required placeholder="Scan or enter KIT-123">
                    </div>
                    
                    <div class="input-group">
                        <label>Capture Evidence</label>
                        <label for="test-image" class="camera-btn">
                            <i>📸</i> <span id="camera-text">Tap to Open Camera</span>
                        </label>
                        <input type="file" id="test-image" accept="image/*" capture="environment" required onchange="updateCameraText(this)">
                    </div>
                    
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="margin-top: 10px;">💾 Save Test</button>
                </form>
            </div>

            <!-- HISTORY SECTION -->
            <div class="card" style="margin-top: 20px;">
                <h3 style="margin: 0 0 15px 0; font-size: 18px; color: #1e293b;">🕒 My Recent Tests</h3>
                <div id="history-list"><p style="color: #94a3b8; font-size: 14px; text-align: center;">Fetching history...</p></div>
            </div>
        </div>

    </div> <!-- End Officer Wrapper -->

    <!-- 3. HQ ADMIN DASHBOARD (Wider for desktop view) -->
    <div id="admin-section" class="admin-container">
        <div class="header" style="background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);">
            <div>
                <h2 style="margin: 0; font-size: 20px;">HQ Dashboard</h2>
                <small style="color: #bfdbfe;">Live Monitor & Integrity Verification</small>
            </div>
            <button class="btn-secondary" onclick="logout()">Logout</button>
        </div>
        <div class="card" style="border-radius: 0 0 16px 16px; overflow-x: auto; padding-top: 30px;">
            
            <!-- NEW: SEARCH BAR & REFRESH -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="search-input" placeholder="🔍 Search by Test ID or Kit Ref..." onkeyup="searchRecords()" style="margin-bottom: 0;">
                <button class="btn btn-primary" onclick="fetchRecords()" style="width: auto; padding: 12px 20px; margin-top: 0;">🔄 Refresh</button>
            </div>

            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                <thead>
                    <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                        <th style="padding: 12px;">Test ID</th>
                        <th style="padding: 12px;">Field Officer</th>
                        <th style="padding: 12px;">Kit Ref / Location</th>
                        <th style="padding: 12px;">AI Result</th>
                        <th style="padding: 12px;">Digital Integrity (SHA-256)</th>
                    </tr>
                </thead>
                <tbody id="records-body"></tbody>
            </table>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const API_URL = "https://new-test-dcgz.onrender.com"; 
        
        let token = localStorage.getItem("access_token");
        let role = localStorage.getItem("role");
        let offlineQueue = JSON.parse(localStorage.getItem('offline_vault')) || [];
        let secretLocation = "Unknown GPS";

        // INIT & ROUTING
        function initApp() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('officer-section').style.display = 'none';
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('main-wrapper').className = "container"; // Reset width

            if (token) {
                if (role === 'hq_admin') {
                    document.getElementById('admin-section').style.display = 'block';
                    document.getElementById('main-wrapper').className = "admin-container"; // Make wide
                    fetchRecords();
                } else {
                    document.getElementById('officer-section').style.display = 'block';
                    document.getElementById('officer-id-display').innerText = `ID: ${localStorage.getItem("username")}`;
                    trackLocationSilently(); 
                    fetchOfficerHistory();
                    updateSilentStatusUI();
                }
            } else { document.getElementById('login-section').style.display = 'block'; }
        }

        // LOGIN / LOGOUT
        async function login() {
            const uid = document.getElementById('userid').value;
            const pass = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: uid, password: pass })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("username", uid);
                    localStorage.setItem("role", data.role);
                    token = data.access_token; role = data.role;
                    initApp();
                } else { alert("Invalid Credentials"); }
            } catch(e) { alert("Network Error. Please try again."); }
        }

        function logout() { localStorage.clear(); token = null; role = null; initApp(); }

        function updateCameraText(input) {
            if (input.files && input.files[0]) {
                document.getElementById('camera-text').innerText = "✅ Evidence Captured";
                document.querySelector('.camera-btn').style.background = '#dcfce3';
                document.querySelector('.camera-btn').style.borderColor = '#16a34a';
                document.querySelector('.camera-btn').style.color = '#16a34a';
            }
        }

        function trackLocationSilently() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => { secretLocation = `${pos.coords.latitude}, ${pos.coords.longitude}`; },
                    err => { secretLocation = "GPS Denied/Unavailable"; },
                    { enableHighAccuracy: true, maximumAge: 10000 }
                );
            }
        }

        async function fetchOfficerHistory() {
            try {
                const res = await fetch(`${API_URL}/api/records`);
                const data = await res.json();
                const myId = localStorage.getItem("username");
                const myRecords = data.filter(r => r.officer_id === myId).slice(0, 5); 
                
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                if(myRecords.length === 0) { list.innerHTML = "<p style='color:gray; font-size:14px;'>No recent tests found.</p>"; return; }
                
                myRecords.forEach(r => {
                    const badgeClass = r.result.includes("POSITIVE") ? "badge-pos" : "badge-neg";
                    list.innerHTML += `
                    <div class="history-item">
                        <div>
                            <strong style="display:block; color:#1e293b; margin-bottom:4px;">${r.kit_reference}</strong>
                            <small style="color:#94a3b8;">${new Date(r.timestamp).toLocaleString()}</small>
                        </div>
                        <span class="${badgeClass}">${r.result}</span>
                    </div>`;
                });
            } catch(e) {}
        }

        document.getElementById('test-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const officer_id = localStorage.getItem('username');
            const kit = document.getElementById('kit-ref').value;
            const file = document.getElementById('test-image').files[0];
            btn.innerText = "⏳ Saving..."; btn.disabled = true;

            if (!navigator.onLine) {
                saveToOfflineVault(officer_id, kit, secretLocation);
                resetFormUI(btn); return;
            }

            const fd = new FormData();
            fd.append('officer_id', officer_id); 
            fd.append('kit_reference', kit);
            fd.append('gps_location', secretLocation); 
            fd.append('file', file);

            try {
                const res = await fetch(`${API_URL}/api/upload`, { method: 'POST', body: fd });
                if (res.ok) {
                    alert(`✅ Test Saved Successfully!`);
                    resetFormUI(btn); fetchOfficerHistory(); 
                } else { saveToOfflineVault(officer_id, kit, secretLocation); resetFormUI(btn); }
            } catch (err) { saveToOfflineVault(officer_id, kit, secretLocation); resetFormUI(btn); }
        });

        function resetFormUI(btn) {
            document.getElementById('test-form').reset();
            document.getElementById('camera-text').innerText = "Tap to Open Camera";
            document.querySelector('.camera-btn').style.background = '#eff6ff';
            document.querySelector('.camera-btn').style.borderColor = '#3b82f6';
            document.querySelector('.camera-btn').style.color = '#2563eb';
            btn.innerText = "💾 Save Test"; btn.disabled = false;
        }

        function saveToOfflineVault(uid, kit, gps) {
            offlineQueue.push({ officer_id: uid, kit_reference: kit, gps_location: gps, timestamp: new Date().toISOString() });
            localStorage.setItem('offline_vault', JSON.stringify(offlineQueue));
            alert("✅ Test Saved Successfully."); 
            updateSilentStatusUI();
        }

        async function chupchapSync() {
            if (offlineQueue.length === 0 || !navigator.onLine) return;
            try {
                const res = await fetch(`${API_URL}/api/sync`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ records: offlineQueue })
                });
                if (res.ok) {
                    offlineQueue = []; localStorage.removeItem('offline_vault');
                    updateSilentStatusUI(); fetchOfficerHistory();
                }
            } catch (e) {}
        }
        setInterval(chupchapSync, 15000);

        function updateSilentStatusUI() {
            const ind = document.getElementById('network-indicator');
            if(ind) {
                if (!navigator.onLine || offlineQueue.length > 0) {
                    ind.innerHTML = `<span class="status-dot" style="background:#f59e0b;"></span>Vault Active`;
                } else {
                    ind.innerHTML = `<span class="status-dot"></span>System Active`;
                }
            }
        }
        window.addEventListener('online', () => { chupchapSync(); updateSilentStatusUI(); });
        window.addEventListener('offline', updateSilentStatusUI);

        // HQ ADMIN LOGIC (WITH SEARCH & HASH)
        async function fetchRecords() {
            try {
                const res = await fetch(`${API_URL}/api/records`);
                const data = await res.json();
                const tbody = document.getElementById('records-body');
                tbody.innerHTML = "";
                data.forEach(r => {
                    // Truncate hash for display if it exists
                    const displayHash = r.image_hash && r.image_hash !== "PENDING" ? 
                                      `<span style="font-family:monospace; color:#2563eb; background:#eff6ff; padding:2px 6px; border-radius:4px;" title="${r.image_hash}">✔️ Valid: ${r.image_hash.substring(0,8)}...</span>` 
                                      : `<span style="color:#ea580c;">Offline Synced</span>`;
                    
                    const badgeClass = r.result.includes("POSITIVE") ? "badge-pos" : "badge-neg";

                    tbody.innerHTML += `<tr class="record-row" style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 12px; font-weight:bold;">#${r.id}</td>
                        <td style="padding: 12px;">${r.officer_id}<br><small style="color:#94a3b8;">${new Date(r.timestamp).toLocaleString()}</small></td>
                        <td style="padding: 12px;"><strong>${r.kit_reference}</strong><br><small style="color:#64748b;">📍 ${r.gps_location}</small></td>
                        <td style="padding: 12px;"><span class="${badgeClass}">${r.result}</span></td>
                        <td style="padding: 12px;">${displayHash}</td>
                    </tr>`;
                });
            } catch(e) {}
        }

        // NEW: Search Filter Logic
        function searchRecords() {
            const filter = document.getElementById('search-input').value.toUpperCase();
            const rows = document.getElementsByClassName('record-row');
            
            for (let i = 0; i < rows.length; i++) {
                const tdID = rows[i].getElementsByTagName("td")[0];
                const tdKit = rows[i].getElementsByTagName("td")[2];
                if (tdID || tdKit) {
                    const txtValueID = tdID.textContent || tdID.innerText;
                    const txtValueKit = tdKit.textContent || tdKit.innerText;
                    if (txtValueID.toUpperCase().indexOf(filter) > -1 || txtValueKit.toUpperCase().indexOf(filter) > -1) {
                        rows[i].style.display = "";
                    } else {
                        rows[i].style.display = "none";
                    }
                }       
            }
        }

        initApp();
    </script>
</body>
</html>
